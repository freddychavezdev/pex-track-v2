name: PEX Track Android Release

on:
  workflow_dispatch:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

jobs:
  signed-release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager "platforms;android-36"

      - name: Validate release secrets
        shell: bash
        run: |
          set -euo pipefail
          for required in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [[ -z "${!required}" ]]; then
              echo "Missing required GitHub secret: ${required}" >&2
              exit 1
            fi
          done

      - name: Configure Supabase and decode keystore
        shell: bash
        run: |
          set -euo pipefail
          printf 'SUPABASE_URL=%s\nSUPABASE_PUBLISHABLE_KEY=%s\n' "$SUPABASE_URL" "$SUPABASE_PUBLISHABLE_KEY" > local.properties
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > pex-track-release.jks

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease

      - name: Sign and verify release APK
        shell: bash
        run: |
          set -euo pipefail
          build_tools="${ANDROID_HOME}/build-tools/$(ls -1 "${ANDROID_HOME}/build-tools" | sort -V | tail -n 1)"
          unsigned="app/build/outputs/apk/release/app-release-unsigned.apk"
          signed="app/build/outputs/apk/release/pex-track-release.apk"
          "${build_tools}/apksigner" sign \
            --ks pex-track-release.jks \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass "pass:${ANDROID_KEYSTORE_PASSWORD}" \
            --key-pass "pass:${ANDROID_KEY_PASSWORD}" \
            --out "$signed" "$unsigned"
          "${build_tools}/apksigner" verify --verbose "$signed"
          sha256sum "$signed" > "${signed}.sha256"

      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f local.properties pex-track-release.jks

      - name: Upload signed release
        uses: actions/upload-artifact@v4
        with:
          name: pex-track-android-release
          path: |
            apps/mobile/app/build/outputs/apk/release/pex-track-release.apk
            apps/mobile/app/build/outputs/apk/release/pex-track-release.apk.sha256
          if-no-files-found: error
          retention-days: 30
